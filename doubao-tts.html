<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>豆包音频生成器</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: #11131a; color: #f7f8fc; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: radial-gradient(circle at 15% 5%, #273b74 0, transparent 28rem), #11131a; }
    main { width: min(760px, calc(100% - 32px)); margin: 48px auto; }
    h1 { margin: 0; font-size: clamp(28px, 5vw, 42px); letter-spacing: -.04em; }
    .intro { color: #b8bfd2; line-height: 1.65; margin: 12px 0 28px; }
    .card { background: rgba(28, 31, 43, .92); border: 1px solid #3b4050; border-radius: 18px; padding: clamp(18px, 4vw, 32px); box-shadow: 0 24px 70px #0004; }
    label { display: block; font-size: 14px; font-weight: 650; margin: 20px 0 8px; }
    label:first-child { margin-top: 0; }
    input, textarea, select { width: 100%; color: #f7f8fc; background: #161922; border: 1px solid #454b5e; border-radius: 10px; font: inherit; padding: 12px 13px; outline: none; }
    input:focus, textarea:focus, select:focus { border-color: #809fff; box-shadow: 0 0 0 3px #6b8cff30; }
    textarea { min-height: 220px; resize: vertical; line-height: 1.65; }
    .hint { color: #9da6bc; font-size: 13px; line-height: 1.55; margin: 7px 0 0; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 16px; }
    .actions { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 26px; }
    button, .download { border: 0; border-radius: 10px; font: inherit; font-weight: 700; padding: 12px 18px; cursor: pointer; text-decoration: none; transition: transform .15s, opacity .15s; }
    button { background: #7c96ff; color: #10162c; }
    button:hover, .download:hover { transform: translateY(-1px); }
    button:disabled { cursor: wait; opacity: .6; }
    .download { background: #2d354a; color: #eff2ff; }
    .status { font-size: 14px; color: #b8bfd2; margin: 0; }
    .status.error { color: #ffaeae; }
    .result { display: none; margin-top: 28px; padding-top: 24px; border-top: 1px solid #3b4050; }
    .result.visible { display: block; }
    audio { display: block; width: 100%; margin: 12px 0 16px; }
    .security { margin-top: 20px; border-left: 3px solid #f3bc62; padding: 2px 0 2px 12px; color: #d7c39d; font-size: 13px; line-height: 1.6; }
    code { color: #b9c7ff; }
    .queue { margin-top: 24px; }
    .queue h2 { margin: 0; font-size: 22px; }
    .queue-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 16px; }
    .queue-toolbar h2 { margin-right: auto; }
    .secondary { background: #2d354a; color: #eff2ff; }
    .task { padding: 20px 0; border-top: 1px solid #3b4050; }
    .task-head { display: flex; justify-content: space-between; gap: 12px; }
    .task-prompt { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.6; max-height: 160px; overflow: auto; color: #cbd2e4; }
    .task-state { color: #b9c7ff; }
    .task[data-state="failed"] .task-state, .task-error { color: #ffaeae; }
    .task[data-state="done"] .task-state { color: #92e6bc; }
    .task .actions { margin-top: 12px; }
    .check { display: flex; align-items: center; gap: 8px; }
    .check input { width: auto; }
    @media (max-width: 520px) { main { margin: 24px auto; } .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>豆包音频生成器</h1>
    <p class="intro">添加音频任务后自动按顺序生成。等待时可以继续添加，每条音频都可单独试听和下载。</p>

    <section class="card">
      <form id="tts-form">
        <label for="api-key">API Key</label>
        <input id="api-key" type="password" autocomplete="off" placeholder="若服务端未配置密钥，请粘贴 X-Api-Key" />
        <p class="hint">本地服务已配置 <code>DOUBAO_API_KEY</code> 时可以留空；否则仅通过本机转发使用，不会保存。</p>

        <label for="prompt">音频提示词</label>
        <textarea id="prompt" required placeholder="例如：先是一声手机震动的声音……">先是一声手机震动的声音，环境中持续的鸟鸣声。音乐以马林巴为主奏乐器，加入合成器 lead、电贝斯、打击乐，整体情绪紧张悬疑。男子1（中青年男性，台湾口音，嗓音低沉、浑厚）用严肃语气说道：“钟 sir，你是什么时候被收买的？”</textarea>
        <label class="check"><input id="batch" type="checkbox" />批量添加（每条提示词之间用单独一行 --- 分隔）</label>
        <p class="hint">每个任务使用加入队列时的音频参数。队列保存在当前页面，请在下载完成前保持页面打开。</p>

        <div class="grid">
          <div>
            <label for="format">输出格式</label>
            <select id="format"><option value="mp3">MP3</option><option value="wav">WAV</option></select>
          </div>
          <div>
            <label for="sample-rate">采样率</label>
            <select id="sample-rate"><option value="48000">48,000 Hz</option><option value="24000">24,000 Hz</option><option value="16000">16,000 Hz</option></select>
          </div>
          <div>
            <label for="speech-rate">语速</label>
            <input id="speech-rate" type="number" value="0" step="1" />
          </div>
          <div>
            <label for="pitch-rate">音高</label>
            <input id="pitch-rate" type="number" value="0" step="1" />
          </div>
        </div>

        <div class="actions">
          <button id="submit" type="submit">加入生成队列</button>
          <p id="status" class="status" aria-live="polite">准备就绪</p>
        </div>
      </form>

      <p class="security">页面请求的是本机的 <code>/api/tts</code>，由本地服务转发至豆包接口，避免浏览器跨域限制。生产环境请只在服务端设置 API Key。</p>
    </section>
    <section class="card queue" aria-labelledby="queue-title">
      <div class="queue-toolbar">
        <h2 id="queue-title">任务队列</h2>
        <button id="pause" class="secondary" type="button" aria-pressed="false">暂停队列</button>
      </div>
      <p id="queue-summary" class="hint" aria-live="polite">还没有任务，添加后将自动开始。</p>
      <p id="pause-hint" class="hint" hidden>队列已暂停；正在生成的任务会继续完成，后续任务等待恢复。</p>
      <div id="tasks"></div>
    </section>
  </main>

  <script>
    const ENDPOINT = '/api/tts';
    const form = document.querySelector('#tts-form');
    const status = document.querySelector('#status');
    const taskList = document.querySelector('#tasks');
    const pauseButton = document.querySelector('#pause');
    const tasks = [];
    let sequence = 0;
    let running = false;
    let paused = false;

    function setStatus(message, isError = false) {
      status.textContent = message;
      status.classList.toggle('error', isError);
    }

    function base64ToBlob(base64, type) {
      const binary = atob(base64.replace(/^data:.*;base64,/, ''));
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
      return new Blob([bytes], { type });
    }

    function updateSummary() {
      const count = (state) => tasks.filter((task) => task.state === state).length;
      document.querySelector('#queue-summary').textContent = tasks.length
        ? `共 ${tasks.length} 条 · 等待 ${count('pending')} · 生成中 ${count('running')} · 完成 ${count('done')} · 失败 ${count('failed')} · 已取消 ${count('cancelled')}`
        : '还没有任务，添加后将自动开始。';
    }

    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function action(label, handler) {
      const button = element('button', 'secondary', label);
      button.type = 'button';
      button.addEventListener('click', handler);
      return button;
    }

    function renderTask(task) {
      // 只更新当前任务，不打断其他已完成音频的播放。
      task.node.replaceChildren();
      task.node.dataset.state = task.state;
      const states = { pending: '等待中', running: '正在生成…', done: '已完成', failed: '生成失败', cancelled: '已取消' };
      const head = element('div', 'task-head');
      head.append(element('strong', '', `任务 #${task.id}`), element('span', 'task-state', states[task.state]));
      const config = task.payload.audio_config;
      task.node.append(head, element('p', 'task-prompt', task.payload.text_prompt),
        element('p', 'hint', `${config.format.toUpperCase()} · ${config.sample_rate} Hz · 语速 ${config.speech_rate} · 音高 ${config.pitch_rate}`));
      const actions = element('div', 'actions');
      if (task.state === 'pending') {
        actions.append(action('取消任务', () => {
          task.state = 'cancelled';
          task.apiKey = '';
          renderTask(task);
          updateSummary();
        }));
      }
      if (task.state === 'failed') {
        task.node.append(element('p', 'task-error', task.error));
        actions.append(action('重新排队', () => {
          task.apiKey = document.querySelector('#api-key').value.trim();
          task.state = 'pending';
          task.error = '';
          // 重试加入队尾，不阻塞原有的待处理任务。
          tasks.splice(tasks.indexOf(task), 1);
          tasks.push(task);
          taskList.append(task.node);
          renderTask(task);
          updateSummary();
          void processQueue();
        }));
      }
      if (task.state === 'done') {
        const audio = element('audio');
        audio.controls = true;
        audio.preload = 'metadata';
        audio.src = task.url;
        const detail = Number.isFinite(task.duration) ? `时长 ${task.duration.toFixed(2)} 秒 · ` : '';
        task.node.append(element('p', 'hint', `${detail}${(task.blob.size / 1024).toFixed(1)} KB`), audio);
        actions.append(action('下载音频', () => downloadTask(task)));
      }
      task.node.append(actions);
    }

    function downloadTask(task) {
      const temporaryUrl = URL.createObjectURL(task.blob);
      const link = element('a');
      link.href = temporaryUrl;
      link.download = task.filename;
      link.hidden = true;
      document.body.appendChild(link);
      link.click();
      link.remove();
      window.setTimeout(() => URL.revokeObjectURL(temporaryUrl), 60_000);
      setStatus(`已请求下载任务 #${task.id}；若未出现文件，请检查浏览器的下载提示。`);
    }

    async function processQueue() {
      if (running || paused) return;
      running = true;
      try {
        while (!paused) {
          const task = tasks.find((item) => item.state === 'pending');
          if (!task) break;
          task.state = 'running';
          renderTask(task);
          updateSummary();
          const controller = new AbortController();
          const timeout = window.setTimeout(() => controller.abort(), 310_000);
          try {
            const response = await fetch(ENDPOINT, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', ...(task.apiKey ? { 'X-Api-Key': task.apiKey } : {}) },
              body: JSON.stringify(task.payload),
              signal: controller.signal
            });
            const data = await response.json().catch(() => ({}));
            const message = data.message || data.error;
            const detail = typeof message === 'string' ? message : message ? JSON.stringify(message) : '';
            if (!response.ok) throw new Error(detail || `请求失败（HTTP ${response.status}）`);
            if (typeof data.audio !== 'string' || !data.audio) throw new Error(detail || '接口未返回音频。');
            task.blob = base64ToBlob(data.audio, task.payload.audio_config.format === 'mp3' ? 'audio/mpeg' : 'audio/wav');
            task.url = URL.createObjectURL(task.blob);
            task.duration = typeof data.duration === 'number' ? data.duration : null;
            task.state = 'done';
          } catch (error) {
            task.state = 'failed';
            task.error = error.name === 'AbortError'
              ? '等待超过 310 秒。远端可能仍在生成，请确认后再重试。'
              : error instanceof Error ? error.message : String(error);
          } finally {
            window.clearTimeout(timeout);
            task.apiKey = '';
          }
          renderTask(task);
          updateSummary();
        }
      } finally {
        running = false;
      }
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const apiKey = document.querySelector('#api-key').value.trim();
      const prompt = document.querySelector('#prompt').value.trim();
      const format = document.querySelector('#format').value;
      const sampleRate = Number(document.querySelector('#sample-rate').value);
      const speechRate = Number(document.querySelector('#speech-rate').value);
      const pitchRate = Number(document.querySelector('#pitch-rate').value);

      if (!prompt) return;
      const prompts = document.querySelector('#batch').checked
        ? prompt.split(/^\s*---[ \t]*$/m).map((text) => text.trim()).filter(Boolean)
        : [prompt];
      if (!prompts.length) return setStatus('请填写至少一条提示词。', true);
      for (const text of prompts) {
        const task = {
          id: ++sequence,
          state: 'pending',
          apiKey,
          payload: {
            model: 'seed-audio-1.0',
            text_prompt: text,
            audio_config: { format, sample_rate: sampleRate, pitch_rate: pitchRate, speech_rate: speechRate, loudness_rate: 0 },
            watermark: {}
          },
          filename: `doubao-audio-${Date.now()}-${sequence}.${format}`,
          node: element('article', 'task')
        };
        tasks.push(task);
        taskList.append(task.node);
        renderTask(task);
      }
      document.querySelector('#prompt').value = '';
      setStatus(`已加入 ${prompts.length} 条任务${paused ? '，恢复队列后生成。' : '，将按顺序自动生成。'}`);
      updateSummary();
      void processQueue();
    });

    pauseButton.addEventListener('click', () => {
      paused = !paused;
      pauseButton.textContent = paused ? '恢复队列' : '暂停队列';
      pauseButton.setAttribute('aria-pressed', String(paused));
      document.querySelector('#pause-hint').hidden = !paused;
      if (!paused) void processQueue();
    });

    window.addEventListener('beforeunload', (event) => {
      if (tasks.some((task) => ['pending', 'running', 'done'].includes(task.state))) {
        event.preventDefault();
        event.returnValue = '';
      }
    });
  </script>
</body>
</html>
